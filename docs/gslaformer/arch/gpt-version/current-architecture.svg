<text x="42" y="58" class="title" text-anchor="start">GSLAformer · 当前实现架构</text>
<text x="44" y="96" class="sub" text-anchor="start">full 变体 / AIDC day profile · 工作区计算版本 2 · 按真实源码绘制，不是原始需求的复刻</text>
