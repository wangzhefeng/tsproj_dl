<rect x="60" y="180" width="480" height="140" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
<text x="78" y="213" font-size="25" font-weight="650">历史实体观测与属性</text>
<text x="78" y="245" font-size="21">逐组 [B,L,Ng,Fg]；实体身份只用于对齐</text>
<text x="78" y="273" font-size="21">数值、观测、适用性、静态属性及有效性</text>
<rect x="60" y="370" width="480" height="140" rx="8" fill="#ede9fe" stroke="#8b74b6" stroke-width="1.8"/>
<text x="78" y="403" font-size="25" font-weight="650">逐组共享实体适配</text>
<text x="78" y="435" font-size="21">动态值、掩码与属性拼接</text>
<text x="78" y="463" font-size="21">Linear → GELU → Linear；输出宽度 ds</text>
<rect x="60" y="560" width="225" height="140" rx="8" fill="#ede9fe" stroke="#8b74b6" stroke-width="1.8"/>
<text x="78" y="593" font-size="25" font-weight="650">动态组</text>
<text x="78" y="625" font-size="21">同组共享 GRU</text>
<text x="78" y="653" font-size="21">逐实体沿时间更新</text>
<rect x="315" y="560" width="225" height="140" rx="8" fill="#ede9fe" stroke="#8b74b6" stroke-width="1.8"/>
<text x="333" y="593" font-size="25" font-weight="650">纯静态组</text>
<text x="333" y="625" font-size="21">无 GRU</text>
<text x="333" y="653" font-size="21">适配结果直接传递</text>
<rect x="60" y="760" width="480" height="145" rx="8" fill="#fff0d9" stroke="#cd9450" stroke-width="1.8"/>
<text x="78" y="793" font-size="25" font-weight="650">逐组、逐时刻的实体交互</text>
<text x="78" y="825" font-size="21">实体 + summary token → 单层空间注意力</text>
<text x="78" y="853" font-size="21">去掉 summary 输出；保留实体 [B,L,Ng,ds]</text>
<rect x="660" y="560" width="500" height="140" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
<text x="678" y="593" font-size="25" font-weight="650">历史关系与有效实体</text>
<text x="678" y="625" font-size="21">每个历史时刻使用对应关系</text>
<text x="678" y="653" font-size="21">有向类型、允许反向通信、padding / present</text>
<rect x="660" y="760" width="500" height="145" rx="8" fill="#fff0d9" stroke="#cd9450" stroke-width="1.8"/>
<text x="678" y="793" font-size="25" font-weight="650">跨组类型关系交互</text>
<text x="678" y="825" font-size="21">在实体轴拼接全部 G 组；按帧独立计算</text>
<text x="678" y="853" font-size="21">加性通信掩码与方向偏置；层数来自配置</text>
<rect x="660" y="965" width="500" height="150" rx="8" fill="#fff0d9" stroke="#cd9450" stroke-width="1.8"/>
<text x="678" y="998" font-size="25" font-weight="650">仅对动态组进行独立查询读出</text>
<text x="678" y="1030" font-size="21">Q：可学习查询；K/V：实体 + 常驻空组 token</text>
<text x="678" y="1058" font-size="21">池化结果拼接 log1p(N)、coverage → Linear</text>
<text x="678" y="1086" font-size="21"> → LN</text>
<rect x="660" y="1170" width="500" height="140" rx="8" fill="#e3f0ff" stroke="#5486b9" stroke-width="1.8"/>
<text x="678" y="1203" font-size="25" font-weight="650">动态组历史状态 z</text>
<text x="678" y="1235" font-size="21">全窗口 [B,L,Gd,dz]；单时刻 [B,Gd,dz]</text>
<text x="678" y="1263" font-size="21">按组轴堆叠，进入时间链时才展平特征轴</text>
<rect x="1260" y="180" width="480" height="140" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
<text x="1278" y="213" font-size="25" font-weight="650">预测起点的静态证据</text>
<text x="1278" y="245" font-size="21">有效实体的属性、类别与数量</text>
<text x="1278" y="273" font-size="21">起点关系的逐类型出入度；不读动态值</text>
<rect x="1260" y="370" width="480" height="140" rx="8" fill="#ddf2ec" stroke="#589a8b" stroke-width="1.8"/>
<text x="1278" y="403" font-size="25" font-weight="650">逐组静态统计与投影</text>
<text x="1278" y="435" font-size="21">均值、总和、可用率、数量及度数</text>
<text x="1278" y="463" font-size="21">类别嵌入均值；每组 Linear → GELU</text>
<rect x="1260" y="560" width="480" height="140" rx="8" fill="#ddf2ec" stroke="#589a8b" stroke-width="1.8"/>
<text x="1278" y="593" font-size="25" font-weight="650">固定静态条件 c</text>
<text x="1278" y="625" font-size="21">拼接全部组统计表示 → 单 Linear</text>
<text x="1278" y="653" font-size="21">[B,dt]；同一起点的整段预测共用</text>
<rect x="1260" y="790" width="480" height="170" rx="8" fill="#ffffff" stroke="#c4cfdb" stroke-width="1.8"/>
<text x="1278" y="823" font-size="25" font-weight="650">配置边界</text>
<text x="1278" y="855" font-size="21">G：全部组；Gd：动态组</text>
<text x="1278" y="883" font-size="21">所有组可参与关系；只有动态组产生 z</text>
<text x="1278" y="911" font-size="21">关系层通常为 2 层，但不是硬编码常量</text>
<rect x="1260" y="1060" width="480" height="170" rx="8" fill="#ffffff" stroke="#c4cfdb" stroke-width="1.8"/>
<text x="1278" y="1093" font-size="25" font-weight="650">后续使用</text>
<text x="1278" y="1125" font-size="21">z 与真实负荷历史用于时间预测</text>
<text x="1278" y="1153" font-size="21">c 独立进入每一步条件融合</text>
<text x="1278" y="1181" font-size="21">推理路径与训练路径分别见图 02、03</text>
