<text x="260.0" y="394" class="node-title" text-anchor="middle">实体属性适配 + 因果 GRU</text>
<text x="260.0" y="421" class="node-line" text-anchor="middle">值 / mask / 静态属性 → 32 维</text>
<text x="260.0" y="446" class="node-line" text-anchor="middle">每实体沿 L 步积累历史</text>
</g>
<g class="diagram-node"><rect x="495" y="365" width="350" height="116" rx="7" fill="#F0EEE6" stroke="#D1CFC5" stroke-width="1.5"/>
<text x="670.0" y="394" class="node-title" text-anchor="middle">组内空间 Transformer</text>
<text x="670.0" y="421" class="node-line" text-anchor="middle">摘要 token + 实体 tokens</text>
<text x="670.0" y="446" class="node-line" text-anchor="middle">1 层 · 4 heads · Post-LN</text>
</g>
<g class="diagram-node"><rect x="905" y="365" width="350" height="116" rx="7" fill="#EFF3E9" stroke="#788C5D" stroke-width="1.5"/>
<text x="1080.0" y="394" class="node-title" text-anchor="middle">类型关系注意力</text>
<text x="1080.0" y="421" class="node-line" text-anchor="middle">实体级跨组消息 · 2 层</text>
<text x="1080.0" y="446" class="node-line" text-anchor="middle">类型 / 方向 bias + 合法边 mask</text>
</g>
<g class="diagram-node"><rect x="1315" y="365" width="400" height="116" rx="7" fill="#FBEDE7" stroke="#D97757" stroke-width="1.5"/>
<text x="1515.0" y="394" class="node-title" text-anchor="middle">每动态组查询池化</text>
<text x="1515.0" y="421" class="node-line" text-anchor="middle">query attention + 数量 / 覆盖率</text>
<text x="1515.0" y="446" class="node-line" text-anchor="middle">Linear → LayerNorm → 32 维</text>
</g>
<path class="edge" d="M435,423 L495,423"/>
<path class="edge" d="M845,423 L905,423"/>
<path class="edge" d="M1255,423 L1315,423"/>
