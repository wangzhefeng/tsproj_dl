<text x="1570.0" y="771" class="node-line" text-anchor="middle">Linear(64→1) → ŷₖ</text>
</g>
<g class="diagram-node"><rect x="1440" y="815" width="260" height="70" rx="7" fill="#F0EEE6" stroke="#D1CFC5" stroke-width="1.5"/>
<text x="1570.0" y="844" class="node-title" text-anchor="middle">分组状态头 ×6</text>
<text x="1570.0" y="871" class="node-line" text-anchor="middle">Linear(64→32) → ẑₖ</text>
</g>
