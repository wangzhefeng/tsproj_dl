<g class="diagram-node"><rect x="1440" y="930" width="260" height="75" rx="7" fill="#FBEDE7" stroke="#D97757" stroke-width="1.5"/>
<text x="1570.0" y="959" class="node-title" text-anchor="middle">同一步 ŷₖ + ẑₖ</text>
<text x="1570.0" y="986" class="node-line" text-anchor="middle">存入结果，并回填状态窗口</text>
</g>
<g class="diagram-node"><rect x="700" y="1040" width="390" height="110" rx="7" fill="#EFF3E9" stroke="#788C5D" stroke-width="1.5"/>
<text x="895.0" y="1069" class="node-title" text-anchor="middle">起点静态条件 c[B,64]</text>
<text x="895.0" y="1096" class="node-line" text-anchor="middle">属性统计 / 类别 / 关系度数</text>
<text x="895.0" y="1121" class="node-line" text-anchor="middle">逐组投影 → 拼接 → 单层 Linear</text>
</g>
<g class="diagram-node"><rect x="1190" y="1040" width="500" height="110" rx="7" fill="#EFF3E9" stroke="#788C5D" stroke-width="1.5"/>
<text x="1440.0" y="1069" class="node-title" text-anchor="middle">完整已知未来路径 p[B,24,64]</text>
<text x="1440.0" y="1096" class="node-line" text-anchor="middle">日历 + 计划 / 天气值 + mask + 位置</text>
<text x="1440.0" y="1121" class="node-line" text-anchor="middle">1 层双向 Transformer；原起点固定</text>
</g>
<path class="edge" d="M895,1040 L895,970 L1080,970 L1080,870"/>
<path class="edge" d="M1440,1040 L1440,1018 L1220,1018 L1220,870"/>
<path class="edge" d="M1700,968 L1745,968 L1745,1240 L65,1240 L65,802 L100,802"/>
<text x="115" y="1188" class="node-line" text-anchor="start">回灌规则：丢弃最早 token；追加生成 z / y；observed=false，generated=true，coverage=0</text>
<text x="115" y="1220" class="small" text-anchor="start">重复 H=24 步；真实历史编码一次，未来路径编码一次，时间窗口完整重算 H 次；无 KV cache</text>
<text x="80" y="1345" class="small" text-anchor="start">浅灰：保留主干 / 具体算子     浅绿：原图之外新增     浅橙：语义替代或扩展     输出：y[B,24,1] 与 z[B,24,6,32]</text>
</svg>
