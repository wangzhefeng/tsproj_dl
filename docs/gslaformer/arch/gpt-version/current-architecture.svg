<text x="900.0" y="579" class="node-title" text-anchor="middle">规范状态 z[B, L, 6, 32]</text>
<text x="900.0" y="606" class="node-line" text-anchor="middle">动态组横向拼接 · 时间纵向堆叠 · 每时刻 192 维</text>
</g>
<text x="85" y="550" class="small" text-anchor="start">不加实体行号位置编码</text>
<text x="85" y="579" class="small" text-anchor="start">ID 只用于对齐，不做可学习查表</text>
<rect x="40" y="650" width="1720" height="660" rx="12" fill="#FFFFFF" stroke="#D1CFC5" stroke-width="1.5"/>
<text x="62" y="684" class="panel-title" text-anchor="start">B  系统时间建模 → 条件融合 → 双头自由递推</text>
<text x="62" y="713" class="small" text-anchor="start">空间状态与总负荷共同回灌；输出状态不反解实体、不重新运行实体 GRU</text>
<path class="edge" d="M480,582 L450,582 L450,638 L55,638 L55,725 L275,725 L275,735"/>
<g class="diagram-node"><rect x="100" y="735" width="350" height="135" rx="7" fill="#FBEDE7" stroke="#D97757" stroke-width="1.5"/>
<text x="275.0" y="764" class="node-title" text-anchor="middle">长度固定的系统状态窗口</text>
<text x="275.0" y="791" class="node-line" text-anchor="middle">z + y + 质量 / 来源标记</text>
<text x="275.0" y="816" class="node-line" text-anchor="middle">+ 四维日历 → token[B,L,211]</text>
<text x="275.0" y="841" class="node-line" text-anchor="middle">L=168；生成态与观测态分开</text>
</g>
<g class="diagram-node"><rect x="550" y="735" width="330" height="135" rx="7" fill="#F0EEE6" stroke="#D1CFC5" stroke-width="1.5"/>
<text x="715.0" y="764" class="node-title" text-anchor="middle">因果时间 Transformer</text>
<text x="715.0" y="791" class="node-line" text-anchor="middle">Linear(211→64) + 正弦位置</text>
<text x="715.0" y="816" class="node-line" text-anchor="middle">2 层 · 4 heads · Post-LN</text>
<text x="715.0" y="841" class="node-line" text-anchor="middle">仅取最后位置 h[B,64]</text>
</g>
<path class="edge" d="M450,802 L550,802"/>
<g class="diagram-node"><rect x="970" y="735" width="360" height="135" rx="7" fill="#EFF3E9" stroke="#788C5D" stroke-width="1.5"/>
<text x="1150.0" y="764" class="node-title" text-anchor="middle">逐步条件融合</text>
<text x="1150.0" y="791" class="node-line" text-anchor="middle">拼接 h、静态 c、未来 pₖ</text>
<text x="1150.0" y="816" class="node-line" text-anchor="middle">+ 原起点 lead(k)：16 维</text>
<text x="1150.0" y="841" class="node-line" text-anchor="middle">MLP(208→64→64)</text>
</g>
<path class="edge" d="M880,802 L970,802"/>
